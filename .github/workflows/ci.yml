# push / Pull Request 때마다 자동 점검 (scripts/run_checks.py와 동일)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]   # 과제 최소 버전 3.10 포함
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 자동 점검 (문법 · 단위 테스트 · 퀴즈 검증 · 실행 스모크)
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_checks.py
